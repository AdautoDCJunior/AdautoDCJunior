name: Perfil 3D

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Gerar calendário 3D
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # PROFILE_3D_TOKEN é opcional: um token pessoal faz o radar e o
          # gráfico de linguagens incluírem a atividade em repositórios privados.
          GITHUB_TOKEN: ${{ secrets.PROFILE_3D_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-contrib.json

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
